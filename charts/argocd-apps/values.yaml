spec:
  destination:
    server: https://kubernetes.default.svc
  source:
    repoURL: "git@github.com:hamishfor/helm-values.git"
    targetRevision: main
    ref: values_repo
  # Source for this repo's own charts (deluge, immich, ...). Argo renders them
  # straight from git, so a push to main deploys without a version bump.
  chartsSource:
    repoURL: "git@github.com:hamishfor/helm-charts.git"
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true
