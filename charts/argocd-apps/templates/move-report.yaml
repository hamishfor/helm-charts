apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: move-report
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: move-report
    server: {{ .Values.spec.destination.server }}
  sources:
    - repoURL: {{ .Values.spec.source.repoURL }}
      targetRevision: {{ .Values.spec.source.targetRevision }}
      ref: {{ .Values.spec.source.ref }}
    - repoURL: {{ .Values.spec.chartsSource.repoURL }}
      targetRevision: {{ .Values.spec.chartsSource.targetRevision }}
      path: charts/move-report
      helm:
        valueFiles:
          - $values_repo/charts/move-report/values.yaml
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
